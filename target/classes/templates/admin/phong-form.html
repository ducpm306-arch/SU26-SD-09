<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Form phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h3 th:text="${title}"></h3>

    <form th:action="@{/admin/phong/save}" th:object="${phong}" method="post" class="mt-3">
        <input type="hidden" th:field="*{maPhong}">

        <div class="mb-3">
            <label class="form-label">Loại phòng</label>
            <select name="loaiPhongId" class="form-select" required>
                <option value="">-- Chọn loại phòng --</option>
                <option th:each="lp : ${loaiPhongs}"
                        th:value="${lp.id}"
                        th:text="${lp.tenLoaiPhong}"
                        th:selected="${phong.loaiPhong != null and phong.loaiPhong.id == lp.id}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Tên phòng</label>
            <input type="text" th:field="*{tenPhong}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Số phòng</label>
            <input type="text" th:field="*{soPhong}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Số tầng</label>
            <input type="number" th:field="*{soTang}" class="form-control" min="1" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Giá mỗi đêm</label>
            <input type="number" th:field="*{giaMoiDem}" class="form-control" min="0" step="1000" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Trạng thái</label>
            <select th:field="*{trangThai}" class="form-select" required>
                <option value="Trống">Trống</option>
                <option value="Đang sử dụng">Đang sử dụng</option>
                <option value="Đang dọn dẹp">Đang dọn dẹp</option>
                <option value="Bảo trì">Bảo trì</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Mã CCCD</label>
            <input type="text" th:field="*{maCccd}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Mô tả</label>
            <textarea th:field="*{moTa}" class="form-control" rows="3"></textarea>
        </div>

        <div class="form-check mb-3">
            <input type="checkbox" th:field="*{hoatDong}" class="form-check-input">
            <label class="form-check-label">Hoạt động</label>
        </div>

        <button class="btn btn-primary">Lưu</button>
        <a th:href="@{/admin/phong}" class="btn btn-secondary">Quay lại</a>
    </form>
</div>
</body>
</html>
